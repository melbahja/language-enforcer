<!DOCTYPE html>
<html>
<head>
	<style>
		body {
			font-family: "Segoe UI", Tahoma, sans-serif;
			background: #f4f4f9;
			color: #222;
			padding: 15px;
			width: 340px;
			min-height: 80vh;
		}

		h3 {
			margin: 0 0 15px 0;
			font-size: 16px;
			color: #333;
			text-align: center;
		}

		.lang-section {
			display: flex;
			gap: 8px;
			margin-bottom: 15px;
			align-items: center;
		}

		#langInput {
			width: 50px;
			text-align: center;
			text-transform: lowercase;
			padding: 6px;
			border: 1px solid #ccc;
			border-radius: 14px;
			font-size: 14px;
		}

		.input-row {
			display: flex;
			gap: 8px;
			margin-bottom: 8px;
		}

		input[type="text"], select {
			flex: 1;
			padding: 6px 8px;
			border: 1px solid #ccc;
			border-radius: 14px;
			font-size: 13px;
		}

		select {
			flex: 0 0 90px;
		}

		button {
			padding: 7px 12px;
			border: none;
			border-radius: 14px;
			background-color: #4a90e2;
			color: white;
			font-size: 13px;
			cursor: pointer;
			transition: background 0.2s;
			white-space: nowrap;
		}

		button:hover {
			background-color: #357abd;
		}

		button.secondary {
			background-color: #6c757d;
			width: 100%;
			margin: 8px 0;
		}

		button.secondary:hover {
			background-color: #5a6268;
		}

		button.danger {
			background-color: #dc3545;
			padding: 4px 8px;
			font-size: 11px;
			margin-left: auto;
		}

		button.danger:hover {
			background-color: #c82333;
		}

		ul {
			list-style: none;
			padding-left: 0;
			max-height: 220px;
			overflow-y: auto;
			margin-top: 10px;
			border-top: 2px solid #ddd;
		}

		ul li {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 10px 8px;
			border-bottom: 1px solid #eee;
			font-size: 13px;
		}

		ul li:last-child {
			border-bottom: none;
		}

		.domain-info {
			display: flex;
			flex-direction: column;
			flex: 1;
			gap: 2px;
		}

		.domain-pattern {
			font-weight: 600;
			color: #333;
		}

		.domain-param {
			font-size: 11px;
			color: #666;
			font-family: monospace;
			background: #e9ecef;
			padding: 2px 6px;
			border-radius: 4px;
			display: inline-block;
			width: fit-content;
		}

		.empty-state {
			text-align: center;
			color: #999;
			font-style: italic;
			padding: 20px;
			font-size: 13px;
		}

		hr {
			border: none;
			border-top: 1px solid #ddd;
			margin: 15px 0;
		}

		label {
			font-size: 12px;
			color: #555;
			font-weight: 500;
		}
	</style>
</head>
<body>
	<h3>Language Enforcer</h3>

	<div class="lang-section">
		<label>Primary Lang:</label>
		<input type="text" id="langInput" placeholder="en" maxlength="2">
		<button id="saveLangBtn">Save</button>
	</div>

	<hr>

	<label>Add Domain + Param:</label>
	<div class="input-row">
		<input type="text" id="domainInput" placeholder="*.google.com">
		<select id="paramSelect">
			<option value="hl">hl</option>
			<option value="lang">lang</option>
			<option value="locale">locale</option>
			<option value="language">language</option>
			<option value="l">l</option>
			<option value="lng">lng</option>
		</select>
	</div>
	<button id="addDomainBtn" style="width: 100%;">Add Domain</button>
	<button id="addCurrentBtn" class="secondary">Add Current Site</button>

	<ul id="domainList"></ul>
	<script src="popup.js"></script>
</body>
</html>
